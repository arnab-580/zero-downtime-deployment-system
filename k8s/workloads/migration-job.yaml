apiVersion: batch/v1
kind: Job
metadata:
  name: orderpulse-migrate-v1
  namespace: deployment-engine
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        job: orderpulse-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: migrate
          image: ghcr.io/arnab-580/orderpulse-api:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orderpulse-db-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }