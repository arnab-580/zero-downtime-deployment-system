apiVersion: v1
kind: Service
metadata:
  name: orderpulse-stable
  namespace: deployment-engine
spec:
  type: ClusterIP
  selector:
    app: orderpulse-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: orderpulse-canary
  namespace: deployment-engine
spec:
  type: ClusterIP
  selector:
    app: orderpulse-api
  ports:
    - name: http
      port: 80
      targetPort: 8000