apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orderpulse-api-pdb
  namespace: deployment-engine
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: orderpulse-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protect-data-tier
  namespace: deployment-engine
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["postgres", "redis"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: orderpulse-api
        - podSelector:
            matchLabels:
              job: orderpulse-migrate
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379