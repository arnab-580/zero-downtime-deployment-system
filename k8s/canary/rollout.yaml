apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: deployment-engine
  labels:
    app: deployment-engine
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployment-engine
      track: canary
  template:
    metadata:
      labels:
        app: deployment-engine
        track: canary
    spec:
      containers:
        - name: website
          image: zero-downtime:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: canary
  namespace: deployment-engine
spec:
  selector:
    app: deployment-engine
    track: canary
  ports:
    - name: http
      port: 80
      targetPort: 80
