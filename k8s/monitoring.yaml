apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: deployment-engine }
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s
    scrape_configs:
      - job_name: nginx-workload
        metrics_path: /metrics
        static_configs:
          - targets: ['active.deployment-engine.svc.cluster.local:9113', 'preview.deployment-engine.svc.cluster.local:9113']
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: deployment-engine }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ containerPort: 9090 }]
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes: [{ name: config, configMap: { name: prometheus-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: deployment-engine }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasources, namespace: deployment-engine }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 2s
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: deployment-engine }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports: [{ containerPort: 3000 }]
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: deployment-engine }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
