apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue
  namespace: deployment-engine
  labels:
    app: deployment-engine
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployment-engine
      color: blue
  template:
    metadata:
      labels:
        app: deployment-engine
        color: blue
    spec:
      containers:
        - name: website
          image: zero-downtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args: ["-nginx.scrape-uri=http://127.0.0.1:80/stub_status"]
          ports:
            - containerPort: 9113
              name: metrics
          resources:
            requests:
              cpu: "5m"
              memory: "10Mi"
            limits:
              cpu: "30m"
              memory: "20Mi"
---
