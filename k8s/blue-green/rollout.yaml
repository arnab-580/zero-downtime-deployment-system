apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue
  namespace: deployment-engine
  labels:
    app: deployment-engine
    color: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: deployment-engine
      color: blue
  template:
    metadata:
      labels:
        app: deployment-engine
        color: blue
    spec:
      containers:
        - name: website
          image: zero-downtime:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args: ["-nginx.scrape-uri=http://127.0.0.1:80/stub_status"]
          ports:
            - containerPort: 9113
              name: metrics
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
---
