name: CI — Lint, Test, Scan & Push to GHCR

on:
  push:
    branches: ["main", "feat/core-foundation"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/arnab-580/orderpulse-api

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Lint (Ruff) & Unit Tests (Pytest)
        working-directory: app
        run: |
          pip install --no-cache-dir -r requirements.txt pytest==9.2.0 httpx==0.28.1 ruff==0.17.6
          ruff check .
          pytest -v

      - name: Build Container Image Once (Local Daemon)
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t orderpulse-api:scan \
            ./app

      - name: Trivy Vulnerability Scan (Fail on CRITICAL CVEs BEFORE Push)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orderpulse-api:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & Push Verified Immutable Image to GHCR
        if: github.event_name == 'push'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker tag orderpulse-api:scan "${IMAGE_NAME}:sha-${SHORT_SHA}"
          docker push "${IMAGE_NAME}:sha-${SHORT_SHA}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            docker tag orderpulse-api:scan "${IMAGE_NAME}:${TAG_NAME}"
            docker push "${IMAGE_NAME}:${TAG_NAME}"
          fi