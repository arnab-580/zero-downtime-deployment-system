name: CI — Test, Scan & Publish to GHCR

on:
  push:
    branches: ["main", "feat/core-foundation"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: arnab-580/orderpulse-api

jobs:
  test-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Lint (ruff) & Unit Tests (pytest)
        working-directory: app
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          APP_VERSION: "ci-test"
        run: |
          pip install --no-cache-dir -r requirements.txt pytest httpx ruff
          ruff check main.py alembic/env.py tests/
          PYTHONPATH=. pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image locally (before security scan)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy CVE Vulnerability Scan (Block CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable image to GHCR
        if: github.event_name == 'push'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:${SHORT_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${SHORT_SHA}"

          # If pushed via a Git release tag (e.g. v1.0.0), publish that exact version tag too
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:${TAG}"
            docker push "${IMAGE}:${TAG}"
          fi